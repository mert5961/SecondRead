<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="452" viewBox="0 0 1000 452" role="img"><title>One case: the AI alone says stable disease (wrong), SecondRead says progressive disease (right)</title><rect width="100%" height="100%" rx="12" fill="#fcfcfb"/><text x="32" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="650" fill="#0b0b0b" text-anchor="start">Same report, same rules. Two ways to get the answer.</text><text x="32" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#898781" text-anchor="start">Synthetic case from the eval. Model: qwen3.8:27b (local). RECIST 1.1.</text><rect x="32" y="92" width="420" height="328" rx="8" fill="#f3f2ef"/><text x="52" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">THE REPORT</text><text x="52" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">BASELINE:</text><text x="52" y="174" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">- Lung mass measuring 40 x 30 mm.</text><text x="52" y="198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">- Liver lesion measuring 60 x 45 mm.</text><text x="52" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">FOLLOW-UP 1:</text><text x="52" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">- Liver lesion: 30 x 22 mm.</text><text x="52" y="278" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">- The lung mass now measures 20 x 15 mm.</text><text x="52" y="310" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="700" fill="#0b0b0b" text-anchor="start">FOLLOW-UP 2:</text><text x="52" y="334" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">- Lung mass: 25 x 18 mm.</text><text x="52" y="358" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">- The liver lesion now measures 37 x 28 mm.</text><text x="52" y="398" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="600" fill="#898781" text-anchor="start">Sum of sizes: 100 mm → 50 mm (lowest) → 62 mm</text><rect x="476" y="92" width="492" height="152" rx="8" fill="#f3f2ef"/><rect x="476" y="92" width="4" height="152" rx="2" fill="#d03b3b"/><text x="496" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">A.  THE AI DECIDES ALONE (rules in its prompt)</text><text x="496" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Stable disease</text><text x="948" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#d03b3b" text-anchor="end">✗ wrong</text><text x="496" y="182" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">“...a 20% increase from the nadir (52 mm) but fails to</text><text x="496" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">meet the &gt;= 5 mm absolute increase...”</text><text x="496" y="224" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Lowest sum was 50 mm, and +12 mm is more than 5 mm.</text><rect x="476" y="256" width="492" height="164" rx="8" fill="#f3f2ef"/><rect x="476" y="256" width="4" height="164" rx="2" fill="#0a7d0a"/><text x="496" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#898781" text-anchor="start">B.  THE AI ONLY READS, CODE DECIDES (SecondRead)</text><text x="496" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#0b0b0b" text-anchor="start">Progressive disease</text><text x="948" y="316" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#0a7d0a" text-anchor="end">✓ correct</text><text x="496" y="346" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">sum 62 mm vs nadir 50 mm = +12 mm (+24.0%)</text><text x="496" y="367" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">needs &gt;= +20% and &gt;= +5 mm  →  both met</text><text x="496" y="388" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">Every answer comes with this working, so a reader</text><text x="496" y="409" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400" fill="#52514e" text-anchor="start">can check it in seconds.</text></svg>